<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Análise de Filas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 22px; letter-spacing: 1px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { color: #22c55e; text-decoration: none; font-size: 13px; }
        .nav a:hover { text-decoration: underline; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-card .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
        .stat-card .value.green { color: #22c55e; }
        .stat-card .value.yellow { color: #eab308; }
        .stat-card .value.red { color: #ef4444; }
        .chart-wrap {
            width: 100%;
            max-width: 800px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        canvas { width: 100% !important; height: auto !important; max-height: 300px; }
        .table-wrap {
            width: 100%;
            max-width: 800px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #1a1a1a;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #222;
        }
        tr:hover td { background: #1a1a1a; }
        .loading { color: #555; font-size: 14px; margin-top: 40px; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>HISTÓRICO DA FILA</h1>
    <p class="subtitle">Acompanhamento e estatísticas do monitoramento</p>
    <div class="nav"><a href="/">&larr; Voltar ao monitoramento</a></div>

    <div class="stats-grid" id="statsContainer"></div>
    <div class="chart-wrap"><canvas id="grafico"></canvas></div>
    <div class="table-wrap"><table id="tabela"><thead><tr><th>ID</th><th>Pessoas</th><th>Tempo est.</th><th>Entradas</th><th>Saídas</th><th>Horário</th></tr></thead><tbody></tbody></table></div>
    <div class="loading" id="loading">Carregando...</div>

    <script>
        async function carregar() {
            try {
                const [hist, stats] = await Promise.all([
                    fetch("/api/historico").then(r => r.json()),
                    fetch("/api/estatisticas").then(r => r.json()),
                ]);

                if (hist.erro || stats.erro) {
                    document.getElementById("loading").textContent = "Erro: " + (hist.erro || stats.erro);
                    document.getElementById("loading").className = "error-msg";
                    return;
                }

                document.getElementById("loading").style.display = "none";

                // Stats cards
                const cards = [
                    { label: "Média de pessoas", value: stats.media_pessoas, cls: "yellow" },
                    { label: "Máximo de pessoas", value: stats.max_pessoas, cls: "red" },
                    { label: "Mínimo de pessoas", value: stats.min_pessoas, cls: "green" },
                    { label: "Total entradas", value: stats.total_entradas, cls: "green" },
                    { label: "Total saídas", value: stats.total_saidas, cls: "green" },
                    { label: "Crescimento (tot.)", value: stats.crescimento, cls: stats.crescimento > 0 ? "red" : "green" },
                ];
                document.getElementById("statsContainer").innerHTML = cards.map(c =>
                    `<div class="stat-card"><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`
                ).join("");

                // Chart
                const dados = stats.dados_crescimento || [];
                const labels = dados.map(d => new Date(d.created_at).toLocaleTimeString("pt-BR"));
                const valores = dados.map(d => d.quantidade);
                new Chart(document.getElementById("grafico"), {
                    type: "line",
                    data: {
                        labels,
                        datasets: [{
                            label: "Pessoas na fila",
                            data: valores,
                            borderColor: "#22c55e",
                            backgroundColor: "rgba(34,197,94,0.1)",
                            fill: true,
                            tension: 0.3,
                            pointRadius: 2,
                        }],
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: "#888" } } },
                        scales: {
                            x: { ticks: { color: "#666", maxTicksLimit: 10 } },
                            y: { ticks: { color: "#666" }, beginAtZero: true },
                        },
                    },
                });

                // Table
                const tbody = document.querySelector("#tabela tbody");
                tbody.innerHTML = hist.map(h =>
                    `<tr><td>${h.id}</td><td>${h.quantidade}</td><td>${h.tempo_estimado}min</td><td>${h.entradas}</td><td>${h.saidas}</td><td>${new Date(h.created_at).toLocaleString("pt-BR")}</td></tr>`
                ).join("");

            } catch (err) {
                document.getElementById("loading").textContent = "Erro ao carregar dados: " + err.message;
                document.getElementById("loading").className = "error-msg";
            }
        }

        carregar();
    </script>
</body>
</html>
