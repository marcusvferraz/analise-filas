<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueVision AI — Histórico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, Arial, sans-serif;
            min-height: 100vh;
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 24px; max-width: 1100px; margin: 0 auto;
        }
        nav .logo { font-size: 17px; font-weight: 700; color: #fff; text-decoration: none; }
        nav .logo span { color: #3b82f6; }
        nav .nav-links { display: flex; gap: 16px; align-items: center; }
        nav .nav-links a { color: #94a3b8; text-decoration: none; font-size: 13px; transition: color 0.2s; }
        nav .nav-links a:hover { color: #fff; }
        nav .nav-links .btn-mon {
            background: rgba(59,130,246,0.12); color: #93c5fd; padding: 6px 14px;
            border-radius: 6px; font-size: 13px; font-weight: 600;
        }
        nav .nav-links .btn-mon:hover { background: rgba(59,130,246,0.2); }

        .container { max-width: 900px; margin: 0 auto; padding: 10px 20px 40px; }

        h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; letter-spacing: -0.3px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(30,41,59,0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; padding: 14px 10px; text-align: center;
        }
        .stat-card .label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; }
        .stat-card .value { font-size: 20px; font-weight: 700; margin-top: 3px; }
        .stat-card .value.green { color: #22c55e; }
        .stat-card .value.yellow { color: #eab308; }
        .stat-card .value.red { color: #ef4444; }
        .stat-card .value.blue { color: #3b82f6; }

        .chart-card {
            background: rgba(30,41,59,0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 18px; margin-bottom: 24px;
        }
        canvas { width: 100% !important; height: auto !important; max-height: 280px; }

        .table-card {
            background: rgba(30,41,59,0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 4px; overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: rgba(15,23,42,0.5); color: #64748b;
            text-transform: uppercase; letter-spacing: 0.8px; font-size: 10px;
            padding: 12px 10px; text-align: left;
        }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); color: #cbd5e1; }
        tr:hover td { background: rgba(59,130,246,0.04); }

        .pagination {
            display: flex; justify-content: center; align-items: center;
            gap: 6px; margin-top: 16px; flex-wrap: wrap;
        }
        .pagination button {
            background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.06);
            color: #94a3b8; padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-size: 13px; transition: all 0.2s;
        }
        .pagination button:hover { background: rgba(59,130,246,0.12); border-color: rgba(59,130,246,0.2); }
        .pagination button:disabled { opacity: 0.3; cursor: default; background: transparent; }
        .pagination .info { color: #475569; font-size: 12px; margin: 0 8px; }

        .loading { color: #475569; font-size: 14px; margin-top: 40px; text-align: center; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<nav>
    <a href="/" style="text-decoration:none;"><div class="logo">Queue<span>Vision</span> AI</div></a>
    <div class="nav-links">
        <a href="/">Início</a>
        <a href="/monitorar" class="btn-mon">Monitorar</a>
    </div>
</nav>

<div class="container">
    <h1>HISTÓRICO DA FILA</h1>
    <p class="subtitle">Acompanhamento e estatísticas do monitoramento</p>

    <div class="stats-grid" id="statsContainer"></div>
    <div class="chart-card"><canvas id="grafico"></canvas></div>
    <div class="table-card">
        <table id="tabela">
            <thead>
                <tr><th>ID</th><th>Pessoas</th><th>Tempo est.</th><th>Tempo real</th><th>Entradas</th><th>Saídas</th><th>Horário</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="pagination" id="paginacao"></div>
    <div class="loading" id="loading">Carregando...</div>
</div>

<script>
    let paginaAtual = 1;

    async function carregarTabela(pagina) {
        try {
            document.getElementById("loading").style.display = "block";
            document.getElementById("loading").textContent = "Carregando...";
            document.getElementById("paginacao").innerHTML = "";

            const res = await fetch(`/api/historico?pagina=${pagina}&por_pagina=25`);
            const hist = await res.json();
            if (hist.erro) {
                document.getElementById("loading").textContent = "Erro: " + hist.erro;
                document.getElementById("loading").className = "error-msg";
                return;
            }

            document.getElementById("loading").style.display = "none";
            paginaAtual = hist.pagina;

            const tbody = document.querySelector("#tabela tbody");
            tbody.innerHTML = hist.dados.map(h => {
                const tempoReal = h.tempo_real_medio != null ? h.tempo_real_medio + "min" : "—";
                return `<tr>
                    <td style="color:#64748b;">${h.id}</td>
                    <td style="color:#22c55e;font-weight:600;">${h.quantidade}</td>
                    <td style="color:#eab308;">${h.tempo_estimado}min</td>
                    <td style="color:#3b82f6;">${tempoReal}</td>
                    <td>${h.entradas}</td>
                    <td>${h.saidas}</td>
                    <td style="color:#64748b;font-size:12px;">${new Date(h.created_at).toLocaleString("pt-BR")}</td>
                </tr>`;
            }).join("");

            const tp = hist.total_paginas;
            const p = hist.pagina;
            let html = `<button onclick="carregarTabela(1)" ${p <= 1 ? "disabled" : ""}>&laquo;</button>`;
            html += `<button onclick="carregarTabela(${p - 1})" ${p <= 1 ? "disabled" : ""}>&lsaquo;</button>`;
            html += `<span class="info">${p} de ${tp} (${hist.total} registros)</span>`;
            html += `<button onclick="carregarTabela(${p + 1})" ${p >= tp ? "disabled" : ""}>&rsaquo;</button>`;
            html += `<button onclick="carregarTabela(${tp})" ${p >= tp ? "disabled" : ""}>&raquo;</button>`;
            document.getElementById("paginacao").innerHTML = html;

        } catch (err) {
            document.getElementById("loading").textContent = "Erro: " + err.message;
            document.getElementById("loading").className = "error-msg";
        }
    }

    async function carregar() {
        try {
            const statsRes = await fetch("/api/estatisticas");
            const stats = await statsRes.json();
            if (stats.erro) {
                document.getElementById("loading").textContent = "Erro: " + stats.erro;
                document.getElementById("loading").className = "error-msg";
                return;
            }

            const mediaReal = stats.media_tempo_real ? stats.media_tempo_real + "min" : "—";
            const cards = [
                { label: "Média pessoas", value: stats.media_pessoas, cls: "yellow" },
                { label: "Máximo pessoas", value: stats.max_pessoas, cls: "red" },
                { label: "Mínimo pessoas", value: stats.min_pessoas, cls: "green" },
                { label: "Total entradas", value: stats.total_entradas, cls: "green" },
                { label: "Total saídas", value: stats.total_saidas, cls: "green" },
                { label: "Tempo real médio", value: mediaReal, cls: "blue" },
                { label: "Tempo est. médio", value: stats.media_tempo_est + "min", cls: "yellow" },
                { label: "Variação total", value: stats.crescimento, cls: stats.crescimento > 0 ? "red" : "green" },
            ];
            document.getElementById("statsContainer").innerHTML = cards.map(c =>
                `<div class="stat-card"><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`
            ).join("");

            const dados = stats.dados_crescimento || [];
            const labels = dados.map(d => new Date(d.created_at).toLocaleTimeString("pt-BR"));
            const valores = dados.map(d => d.quantidade);
            const temposReais = dados.map(d => d.tempo_real_medio);

            new Chart(document.getElementById("grafico"), {
                type: "line",
                data: {
                    labels,
                    datasets: [
                        {
                            label: "Pessoas na fila",
                            data: valores,
                            borderColor: "#22c55e",
                            backgroundColor: "rgba(34,197,94,0.08)",
                            fill: true,
                            tension: 0.3,
                            pointRadius: 2,
                            pointBackgroundColor: "#22c55e",
                            yAxisID: "y",
                        },
                        {
                            label: "Tempo real médio (min)",
                            data: temposReais,
                            borderColor: "#3b82f6",
                            backgroundColor: "rgba(59,130,246,0.08)",
                            fill: true,
                            tension: 0.3,
                            pointRadius: 2,
                            pointBackgroundColor: "#3b82f6",
                            yAxisID: "y1",
                        },
                    ],
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: "#64748b", boxWidth: 12, padding: 12 } },
                    },
                    scales: {
                        x: { ticks: { color: "#475569", maxTicksLimit: 10 } },
                        y: { ticks: { color: "#475569" }, beginAtZero: true, position: "left", grid: { color: "rgba(255,255,255,0.03)" } },
                        y1: { ticks: { color: "#3b82f6" }, beginAtZero: true, position: "right", grid: { drawOnChartArea: false } },
                    },
                },
            });

            carregarTabela(1);

        } catch (err) {
            document.getElementById("loading").textContent = "Erro: " + err.message;
            document.getElementById("loading").className = "error-msg";
        }
    }

    carregar();
</script>
</body>
</html>
