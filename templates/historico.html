<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Análise de Filas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 22px; letter-spacing: 1px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { color: #22c55e; text-decoration: none; font-size: 13px; }
        .nav a:hover { text-decoration: underline; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-card .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
        .stat-card .value.green { color: #22c55e; }
        .stat-card .value.yellow { color: #eab308; }
        .stat-card .value.red { color: #ef4444; }
        .stat-card .value.blue { color: #3b82f6; }
        .chart-wrap {
            width: 100%;
            max-width: 800px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        canvas { width: 100% !important; height: auto !important; max-height: 300px; }
        .table-wrap {
            width: 100%;
            max-width: 800px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #1a1a1a;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #222;
        }
        tr:hover td { background: #1a1a1a; }
        .loading { color: #555; font-size: 14px; margin-top: 40px; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 20px; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .pagination button {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #ccc;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .pagination button:hover { background: #2a2a2a; }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination button.active { background: #22c55e; color: #000; border-color: #22c55e; font-weight: 700; }
        .pagination .info { color: #666; font-size: 12px; margin: 0 8px; }
    </style>
</head>
<body>
    <h1>HISTÓRICO DA FILA</h1>
    <p class="subtitle">Acompanhamento e estatísticas do monitoramento</p>
    <div class="nav"><a href="/monitorar">&larr; Voltar ao monitoramento</a></div>

    <div class="stats-grid" id="statsContainer"></div>
    <div class="chart-wrap"><canvas id="grafico"></canvas></div>
    <div class="table-wrap">
        <table id="tabela">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Pessoas</th>
                    <th>Tempo est.</th>
                    <th>Tempo real</th>
                    <th>Entradas</th>
                    <th>Saídas</th>
                    <th>Horário</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="pagination" id="paginacao"></div>
    <div class="loading" id="loading">Carregando...</div>

    <script>
        let paginaAtual = 1;

        async function carregarTabela(pagina) {
            try {
                document.getElementById("loading").style.display = "block";
                document.getElementById("loading").textContent = "Carregando...";
                document.getElementById("paginacao").innerHTML = "";

                const res = await fetch(`/api/historico?pagina=${pagina}&por_pagina=25`);
                const hist = await res.json();

                if (hist.erro) {
                    document.getElementById("loading").textContent = "Erro: " + hist.erro;
                    document.getElementById("loading").className = "error-msg";
                    return;
                }

                document.getElementById("loading").style.display = "none";
                paginaAtual = hist.pagina;

                const tbody = document.querySelector("#tabela tbody");
                tbody.innerHTML = hist.dados.map(h => {
                    const tempoReal = h.tempo_real_medio != null ? h.tempo_real_medio + "min" : "—";
                    return `<tr>
                        <td>${h.id}</td>
                        <td>${h.quantidade}</td>
                        <td>${h.tempo_estimado}min</td>
                        <td>${tempoReal}</td>
                        <td>${h.entradas}</td>
                        <td>${h.saidas}</td>
                        <td>${new Date(h.created_at).toLocaleString("pt-BR")}</td>
                    </tr>`;
                }).join("");

                // Pagination
                const tp = hist.total_paginas;
                const p = hist.pagina;
                let html = `<button onclick="carregarTabela(1)" ${p <= 1 ? "disabled" : ""}>&laquo;</button>`;
                html += `<button onclick="carregarTabela(${p - 1})" ${p <= 1 ? "disabled" : ""}>&lsaquo;</button>`;
                html += `<span class="info">${p} de ${tp} (${hist.total} registros)</span>`;
                html += `<button onclick="carregarTabela(${p + 1})" ${p >= tp ? "disabled" : ""}>&rsaquo;</button>`;
                html += `<button onclick="carregarTabela(${tp})" ${p >= tp ? "disabled" : ""}>&raquo;</button>`;
                document.getElementById("paginacao").innerHTML = html;

            } catch (err) {
                document.getElementById("loading").textContent = "Erro: " + err.message;
                document.getElementById("loading").className = "error-msg";
            }
        }

        async function carregar() {
            try {
                const statsRes = await fetch("/api/estatisticas");
                const stats = await statsRes.json();

                if (stats.erro) {
                    document.getElementById("loading").textContent = "Erro: " + stats.erro;
                    document.getElementById("loading").className = "error-msg";
                    return;
                }

                const mediaReal = stats.media_tempo_real ? stats.media_tempo_real + "min" : "—";

                const cards = [
                    { label: "Média de pessoas", value: stats.media_pessoas, cls: "yellow" },
                    { label: "Máximo de pessoas", value: stats.max_pessoas, cls: "red" },
                    { label: "Mínimo de pessoas", value: stats.min_pessoas, cls: "green" },
                    { label: "Total entradas", value: stats.total_entradas, cls: "green" },
                    { label: "Total saídas", value: stats.total_saidas, cls: "green" },
                    { label: "Tempo real médio", value: mediaReal, cls: "blue" },
                    { label: "Tempo est. médio", value: stats.media_tempo_est + "min", cls: "yellow" },
                    { label: "Crescimento (tot.)", value: stats.crescimento, cls: stats.crescimento > 0 ? "red" : "green" },
                ];
                document.getElementById("statsContainer").innerHTML = cards.map(c =>
                    `<div class="stat-card"><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`
                ).join("");

                const dados = stats.dados_crescimento || [];
                const labels = dados.map(d => new Date(d.created_at).toLocaleTimeString("pt-BR"));
                const valores = dados.map(d => d.quantidade);
                const temposReais = dados.map(d => d.tempo_real_medio);

                new Chart(document.getElementById("grafico"), {
                    type: "line",
                    data: {
                        labels,
                        datasets: [
                            {
                                label: "Pessoas na fila",
                                data: valores,
                                borderColor: "#22c55e",
                                backgroundColor: "rgba(34,197,94,0.1)",
                                fill: true,
                                tension: 0.3,
                                pointRadius: 2,
                                yAxisID: "y",
                            },
                            {
                                label: "Tempo real médio (min)",
                                data: temposReais,
                                borderColor: "#3b82f6",
                                backgroundColor: "rgba(59,130,246,0.1)",
                                fill: true,
                                tension: 0.3,
                                pointRadius: 2,
                                yAxisID: "y1",
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: "#888" } } },
                        scales: {
                            x: { ticks: { color: "#666", maxTicksLimit: 10 } },
                            y: { ticks: { color: "#666" }, beginAtZero: true, position: "left" },
                            y1: { ticks: { color: "#3b82f6" }, beginAtZero: true, position: "right", grid: { drawOnChartArea: false } },
                        },
                    },
                });

                carregarTabela(1);

            } catch (err) {
                document.getElementById("loading").textContent = "Erro: " + err.message;
                document.getElementById("loading").className = "error-msg";
            }
        }

        carregar();
    </script>
</body>
</html>
