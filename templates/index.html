<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Filas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        #status { margin-bottom: 15px; color: #aaa; font-size: 14px; }
        .video-container {
            position: relative;
            width: 640px;
            max-width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #counter {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
        }
        #counter .num { color: #ff4444; }
        .info {
            margin-top: 12px;
            color: #888;
            font-size: 13px;
            text-align: center;
        }
        .controls { margin-top: 15px; }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        #startBtn { background: #22c55e; color: #fff; }
        #stopBtn { background: #ef4444; color: #fff; display: none; }
        button:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <h1>Análise de Filas</h1>
    <div id="status">Conectando ao servidor...</div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="counter">Pessoas: <span class="num" id="count">0</span></div>
    </div>

    <div class="controls">
        <button id="startBtn">Iniciar Webcam</button>
        <button id="stopBtn">Parar</button>
    </div>
    <p class="info">Apenas frames individuais são enviados ao servidor para processamento</p>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("overlay");
        const ctx = canvas.getContext("2d");
        const countEl = document.getElementById("count");
        const statusEl = document.getElementById("status");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");

        let stream = null;
        let sending = false;
        let animFrame = null;

        video.style.transform = "scaleX(-1)";

        async function sendFrame() {
            if (!sending || !video.videoWidth) {
                animFrame = requestAnimationFrame(sendFrame);
                return;
            }
            const temp = document.createElement("canvas");
            temp.width = video.videoWidth;
            temp.height = video.videoHeight;
            const tctx = temp.getContext("2d");
            tctx.drawImage(video, 0, 0);
            const dataUrl = temp.toDataURL("image/jpeg", 0.7);

            try {
                const res = await fetch("/detect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: dataUrl }),
                });
                const data = await res.json();
                countEl.textContent = data.count;
                drawBoxes(data.boxes, video.videoWidth, video.videoHeight);
            } catch (err) {
                console.error(err);
            }
            animFrame = requestAnimationFrame(sendFrame);
        }

        function drawBoxes(boxes, vw, vh) {
            const rect = video.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!boxes || boxes.length === 0) return;
            const sx = canvas.width / vw;
            const sy = canvas.height / vh;

            for (const b of boxes) {
                const x1 = (vw - b.x1) * sx;
                const y1 = b.y1 * sy;
                const x2 = (vw - b.x2) * sx;
                const y2 = b.y2 * sy;
                ctx.strokeStyle = "#22c55e";
                ctx.lineWidth = 2;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                ctx.fillStyle = "rgba(34,197,94,0.2)";
                ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
                ctx.fillStyle = "#22c55e";
                ctx.font = "12px Arial";
                ctx.textAlign = "left";
                ctx.fillText(b.conf, x1, y1 - 4);
            }
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();
                statusEl.textContent = "Webcam ativa";
                startBtn.style.display = "none";
                stopBtn.style.display = "inline-block";
                sending = true;
                sendFrame();
            } catch (err) {
                statusEl.textContent = "Erro ao acessar webcam: " + err.message;
            }
        }

        function stopCamera() {
            sending = false;
            if (animFrame) cancelAnimationFrame(animFrame);
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            statusEl.textContent = "Webcam parada";
            startBtn.style.display = "inline-block";
            stopBtn.style.display = "none";
            countEl.textContent = "0";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        startBtn.addEventListener("click", startCamera);
        stopBtn.addEventListener("click", stopCamera);
    </script>
</body>
</html>
