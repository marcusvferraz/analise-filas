<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Filas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #e0e0e0;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .video-container {
            position: relative;
            width: 640px;
            max-width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        video, canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 640px;
            max-width: 100%;
            margin-top: 12px;
            padding: 10px 14px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 6px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }
        .info-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .info-value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
        }
        #status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        button {
            padding: 9px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        #startBtn { background: #22c55e; color: #fff; }
        #stopBtn { background: #ef4444; color: #fff; display: none; }
        button:hover { opacity: 0.85; }
        #status-msg {
            margin-top: 10px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>ANÁLISE DE FILAS</h1>
    <p class="subtitle">Monitoramento inteligente em tempo real</p>

    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>

    <div class="info-bar">
        <div class="info-item">
            <span class="info-label">Na fila</span>
            <span class="info-value" id="count">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">Entradas</span>
            <span class="info-value" id="entradas">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">Saídas</span>
            <span class="info-value" id="saidas">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">Tempo est.</span>
            <span class="info-value" id="time-est">0 min</span>
        </div>
        <div class="info-item">
            <span class="info-label">Horário</span>
            <span class="info-value" id="clock">--:--:--</span>
        </div>
        <div class="info-item">
            <span class="info-label">Status</span>
            <span id="status-badge" style="background:#333;color:#999;">—</span>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">Iniciar Webcam</button>
        <button id="stopBtn">Parar</button>
    </div>
    <div id="status-msg">Aguardando início...</div>

    <script>
        const TEMPO_POR_PESSOA = 2;
        const LIMIAR_PEQUENA = 3;
        const LIMIAR_MEDIA = 6;
        const LINHA_X = 0.5;

        const video = document.getElementById("video");
        const canvas = document.getElementById("overlay");
        const ctx = canvas.getContext("2d");
        const countEl = document.getElementById("count");
        const entradasEl = document.getElementById("entradas");
        const saidasEl = document.getElementById("saidas");
        const timeEl = document.getElementById("time-est");
        const badgeEl = document.getElementById("status-badge");
        const clockEl = document.getElementById("clock");
        const statusMsg = document.getElementById("status-msg");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");

        let stream = null;
        let sending = false;
        let animFrame = null;
        let frameCount = 0;
        let lastBoxes = [];

        video.style.transform = "scaleX(-1)";

        setInterval(() => {
            clockEl.textContent = new Date().toLocaleTimeString("pt-BR");
        }, 1000);

        function getStatus(qtd) {
            if (qtd === 0) return { label: "Sem fila", color: "#22c55e", bg: "rgba(34,197,94,0.15)" };
            if (qtd < LIMIAR_PEQUENA) return { label: "Fila pequena", color: "#22c55e", bg: "rgba(34,197,94,0.15)" };
            if (qtd < LIMIAR_MEDIA) return { label: "Fila média", color: "#eab308", bg: "rgba(234,179,8,0.15)" };
            return { label: "Fila lotada", color: "#ef4444", bg: "rgba(239,68,68,0.15)" };
        }

        function render() {
            if (!video.videoWidth) {
                animFrame = requestAnimationFrame(render);
                return;
            }
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const rect = video.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const sx = canvas.width / vw;
            const sy = canvas.height / vh;

            const linha_x = vw * (1 - LINHA_X) * sx;
            ctx.strokeStyle = "#ffff00";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);
            ctx.beginPath();
            ctx.moveTo(linha_x, 0);
            ctx.lineTo(linha_x, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#ffff00";
            ctx.font = "10px Arial";
            ctx.fillText("LINHA VIRTUAL", linha_x + 6, 14);

            for (const b of lastBoxes) {
                const x1 = (vw - b.x1) * sx;
                const y1 = b.y1 * sy;
                const x2 = (vw - b.x2) * sx;
                const y2 = b.y2 * sy;
                ctx.strokeStyle = "#22c55e";
                ctx.lineWidth = 2;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
            }

            animFrame = requestAnimationFrame(render);
        }

        function sendFrame() {
            if (!sending || !video.videoWidth) return;

            frameCount++;
            if (frameCount % 3 !== 0) return;

            const temp = document.createElement("canvas");
            temp.width = video.videoWidth;
            temp.height = video.videoHeight;
            const tctx = temp.getContext("2d");
            tctx.drawImage(video, 0, 0);
            const dataUrl = temp.toDataURL("image/jpeg", 0.5);

            fetch("/detect", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image: dataUrl }),
            })
            .then(res => res.json())
            .then(data => {
                lastBoxes = data.boxes || [];
                const num = data.count || 0;
                countEl.textContent = num;
                entradasEl.textContent = data.entradas || 0;
                saidasEl.textContent = data.saidas || 0;
                timeEl.textContent = (num * TEMPO_POR_PESSOA) + " min";
                const status = getStatus(num);
                badgeEl.textContent = status.label.toUpperCase();
                badgeEl.style.color = status.color;
                badgeEl.style.background = status.bg;
                statusMsg.textContent = "Webcam ativa — monitorando";
            })
            .catch(err => {
                console.error(err);
                statusMsg.textContent = "Erro de conexão com o servidor";
            });
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                await video.play();
                statusMsg.textContent = "Webcam ativa — monitorando";
                startBtn.style.display = "none";
                stopBtn.style.display = "inline-block";
                sending = true;
                frameCount = 0;
                lastBoxes = [];
                render();
                sendFrame();
            } catch (err) {
                statusMsg.textContent = "Erro ao acessar webcam: " + err.message;
            }
        }

        function stopCamera() {
            sending = false;
            if (animFrame) cancelAnimationFrame(animFrame);
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            lastBoxes = [];
            statusMsg.textContent = "Webcam parada";
            startBtn.style.display = "inline-block";
            stopBtn.style.display = "none";
            countEl.textContent = "0";
            entradasEl.textContent = "0";
            saidasEl.textContent = "0";
            timeEl.textContent = "0 min";
            badgeEl.textContent = "—";
            badgeEl.style.background = "#333";
            badgeEl.style.color = "#999";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        startBtn.addEventListener("click", startCamera);
        stopBtn.addEventListener("click", stopCamera);
    </script>
</body>
</html>
